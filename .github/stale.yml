# Configuration for probot-stale
# https://github.com/probot/stale

numberOfDaysBeforeStale: 60
numberOfDaysBeforeClose: 7
staleLabel: stale
exemptIssueLabels:
  - pinned
  - security
exemptPRLabels:
  - pinned
  - security
markCommentAsStale: true
closeComment: >
  This issue has been automatically closed because it has not had
  any recent activity for 7 days after being marked as stale.
  Please feel free to reopen if this is still relevant.
staleComment: >
  This issue has been automatically marked as stale because it has not had
  any recent activity for 60 days. It will be closed in 7 days if no
  further activity occurs.
limitPerRun: 60
only: issues
